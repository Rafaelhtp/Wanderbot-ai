<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WanderBot - Travel Assistant</title>
    <!-- Font Modern -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <!-- Icon Liburan -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-decoration"></div>
    
    <div class="chat-container">
        <header>
            <div class="header-content">
                <div class="logo-area">
                    <i class="fas fa-plane-departure plane-icon"></i>
                    <div>
                        <h1>WanderBot</h1>
                        <span>Asisten Liburanmu 🌴</span>
                    </div>
                </div>
                <div class="header-status">Online</div>
            </div>
        </header>

        <div id="chat-box">
            <!-- Pesan Pembuka -->
            <div class="message bot">
                Halo! Aku WanderBot. Siap membantumu merencanakan liburan impian di Indonesia! Mau ke mana kita hari ini? 🌊☀️
            </div>
        </div>

        <form id="chat-form">
            <div class="input-wrapper">
                <input type="text" id="user-input" placeholder="Tanya rekomendasi tempat asik..." required>
                <!-- Tambahkan aria-label dan title -->
<button type="submit" id="send-btn" aria-label="Kirim Pesan" title="Kirim">
    <i class="fas fa-paper-plane"></i>
</button>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
