<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WanderBot - Travel Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <header>
            <h1>✈️ WanderBot</h1>
            <p>Teman jalan asikmu!</p>
        </header>
        <div id="chat-box"></div>
        <form id="chat-form">
            <input type="text" id="user-input" placeholder="Mau liburan ke mana hari ini?" required>
            <button type="submit">Tanya</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
